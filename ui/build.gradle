// The Yoga binding must compile against the exact version each distribution
// embeds, and the source must use the spelling that version actually ships:
// LWJGL renamed YGNodeMarkDirtyAndPropogateToDescendants ("Propagate") in
// 3.3.3, so bytecode compiled against 3.3.1 throws NoSuchMethodError on a
// 3.3.3 runtime (and any other binding drift must fail in compileCI, not in a
// player's window-resize path). Independent platform builds set atomlibTarget
// (gradle/atomlib-dependencies.gradle); the root build tests against 3.3.1,
// the version pinned for 1.20.1-forge.
def yogaVersion = rootProject.ext.has('atomlibTarget') ? rootProject.ext.atomlibTarget.yoga : '3.3.1'
def generateYogaDirty = tasks.register('generateYogaDirty') {
    def bridgeDir = layout.buildDirectory.dir('generated/yoga-dirty')
    outputs.dir(bridgeDir)
    doLast {
        // Probe the exact binding this build compiles against: the method
        // name is a UTF-8 constant in Yoga.class, so a byte scan settles the
        // spelling without version comparisons that drift with LWJGL.
        def probe = configurations.detachedConfiguration(
                dependencies.create("org.lwjgl:lwjgl-yoga:${yogaVersion}"))
        def binding = probe.files.find { it.name ==~ /lwjgl-yoga-[\d.]+\.jar/ }
        if (binding == null) throw new GradleException("Resolved lwjgl-yoga ${yogaVersion} has no binding jar")
        def entry = zipTree(binding).matching { include 'org/lwjgl/util/yoga/Yoga.class' }.singleFile
        // ISO-8859-1 maps bytes 1:1, so constant-pool strings stay intact.
        String classBytes = entry.getText('ISO-8859-1')
        boolean modern = classBytes.contains('YGNodeMarkDirtyAndPropagateToDescendants')
        boolean legacy = classBytes.contains('YGNodeMarkDirtyAndPropogateToDescendants')
        if (modern == legacy) throw new GradleException(
                "lwjgl-yoga ${yogaVersion} carries neither Yoga markDirty spelling; " +
                'update the YogaDirty generator')
        def source = '''// SPDX-License-Identifier: Apache-2.0
package com.atom.lib.layout.internal;

// GENERATED by ui/build.gradle (generateYogaDirty) — do not edit. LWJGL
// renamed YGNodeMarkDirtyAndPropogateToDescendants to ...Propagate... in
// 3.3.3, so the adapter calls the spelling the yoga version of THIS build
// actually carries; both targets therefore keep the tree-wide dirty without
// NoSuchMethodError at runtime.
final class YogaDirty {
    private YogaDirty() {}
    static void markDirtyAndPropagateToDescendants(long pointer) {
        org.lwjgl.util.yoga.Yoga.YGNodeMarkDirtyAndProp''' + (modern ? 'a' : 'o') + '''gateToDescendants(pointer);
    }
}
'''
        def output = bridgeDir.get().asFile
        new File(output, 'com/atom/lib/layout/internal').mkdirs()
        new File(output, 'com/atom/lib/layout/internal/YogaDirty.java').text = source
    }
}
dependencies {
    api project(':runtime')
    compileOnly "org.lwjgl:lwjgl:${yogaVersion}"
    compileOnly "org.lwjgl:lwjgl-yoga:${yogaVersion}"
    testImplementation "org.lwjgl:lwjgl:${yogaVersion}"
    testImplementation "org.lwjgl:lwjgl-yoga:${yogaVersion}"
    testRuntimeOnly "org.lwjgl:lwjgl:${yogaVersion}:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl-yoga:${yogaVersion}:natives-windows"
    testRuntimeOnly "io.github.humbleui:skija-windows-x64:${rootProject.dependencyVersions.skija}"
}
sourceSets.main.java.srcDir(generateYogaDirty)
tasks.named('compileJava') { dependsOn generateYogaDirty }
