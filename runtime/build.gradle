dependencies {
    api project(':core')
    api "io.github.humbleui:skija-shared:${rootProject.dependencyVersions.skija}"
    api "io.github.humbleui:types:${rootProject.dependencyVersions.types}"
    def os = System.getProperty('os.name').toLowerCase().startsWith('windows') ? 'windows' : 'linux'
    def arch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'x64'
    testRuntimeOnly "io.github.humbleui:skija-${os}-${arch}:${rootProject.dependencyVersions.skija}"
}
